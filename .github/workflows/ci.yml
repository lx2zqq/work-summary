name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - name: Build
        env:
          # 构建期只需要占位值，真实密钥只在部署机器上配置
          APP_PASSWORD: ci-placeholder-password
          AUTH_SECRET: ci-placeholder-secret-at-least-32-bytes-long
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
        run: npm run build
